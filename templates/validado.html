<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: linear-gradient(to right, #a8e063, #56ab2f);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    padding-top: 100px;
}
.card {
    background: rgba(0,0,0,0.3);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    display: inline-block;
}
h1 {
    font-size: 60px;
    margin-bottom: 20px;
}
p {
    font-size: 24px;
}
</style>
</head>
<body>
<div class="card">
    <h1>✅ VALIDADO</h1>
    <p>{{ nombre }} ({{ curp }})</p>
    <p>Reclamo válido hasta <strong>{{ expira }}</strong></p>
</div>
</body>
</html>
